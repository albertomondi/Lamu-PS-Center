<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PS Command Center — Lamu SEZ Sorted</title>
<style>
*{font-family:Tahoma,sans-serif!important;font-size:12px!important;box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text)}
:root{--bg:#f8fafc;--card:#ffffff;--text:#0f172a;--muted:#64748b;--border:#e2e8f0;--green:#16a34a;--blue:#2563eb}
.dark{--bg:#0f172a;--card:#1e293b;--text:#f1f5f9;--muted:#94a3b8;--border:#334155}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px}
.btn{padding:8px 14px;border-radius:8px;border:1px solid var(--border);background:var(--card);cursor:pointer;font-weight:bold}
.btn-green{background:var(--green);color:white;border-color:var(--green)}
.btn-blue{background:var(--blue);color:white;border-color:var(--blue)}
@media print{.no-print{display:none!important}}
</style>
</head>
<body>
<div style="padding:16px;max-width:1400px;margin:0 auto">
<div class="no-print" style="display:flex;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:8px">
<div style="display:flex;gap:8px">
<button class="btn" onclick="document.documentElement.classList.toggle('dark')">🌙/☀️ Dark/Light</button>
<button class="btn" onclick="window.print()">🖨️ Print PDF</button>
<button class="btn btn-blue" onclick="localStorage.setItem('lamuV6data',JSON.stringify(data));alert('Saved locally for PS')">💾 Save: Export</button>
<button class="btn" onclick="if(confirm('RESET to 23 Sept baseline?')){localStorage.clear();location.reload()}">↺ Reset to Source</button>
</div>
<div id="modeInfo" style="color:var(--muted)"></div>
</div>

<div class="card" style="padding:16px;margin-bottom:12px">
<h1 style="margin:0;font-size:16px!important">PS COMMAND CENTER — LAMU OIL REFINERY & SEZ GROUNDBREAKING</h1>
<div id="subHeader" style="color:var(--muted);margin-top:4px"></div>
</div>

<div class="card" style="padding:12px">
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
<b>VVIP TRACKER — SORTED: CONFIRMED (Latest on Top) → PENDING | Congo + DRC Separate</b>
<button class="btn btn-green no-print" onclick="addCountry()">+ Add Country</button>
</div>
<div id="tracker"></div>
</div>
</div>

<script>
// BASELINE FROM YOUR IMAGE — CONFIRMED 4 / PENDING 10 — Republic of Congo & DRC SEPARATE
const baseline=[
{c:"RWANDA",s:"CONFIRMED",name:"H.E. President Paul Kagame",contact:"TBC / ENTER",confirmedAt:Date.now()-1000},
{c:"ETHIOPIA",s:"CONFIRMED",name:"H.E. - Ethiopia",contact:"TBC / ENTER",confirmedAt:Date.now()-2000},
{c:"SOUTH SUDAN",s:"CONFIRMED",name:"H.E. - South Sudan",contact:"TBC / ENTER",confirmedAt:Date.now()-3000},
{c:"TOGO",s:"CONFIRMED",name:"H.E. - Togo",contact:"TBC / ENTER",confirmedAt:Date.now()-4000},
{c:"REPUBLIC OF CONGO (Brazzaville)",s:"PENDING",name:"H.E. President Denis Sassou Nguesso",contact:"TBC / ENTER",confirmedAt:null},
{c:"NIGERIA (Dangote)",s:"PENDING",name:"Mr. Aliko Dangote",contact:"TBC / ENTER",confirmedAt:null},
{c:"UGANDA",s:"PENDING",name:"TBC / ENTER",contact:"TBC / ENTER",confirmedAt:null},
{c:"MOZAMBIQUE",s:"PENDING",name:"TBC / ENTER",contact:"TBC / ENTER",confirmedAt:null},
{c:"BURUNDI",s:"PENDING",name:"TBC / ENTER",contact:"TBC / ENTER",confirmedAt:null},
{c:"BENIN",s:"PENDING",name:"TBC / ENTER",contact:"TBC / ENTER",confirmedAt:null},
{c:"DRC (Congo-Kinshasa)",s:"PENDING",name:"H.E. President Felix Tshisekedi",contact:"TBC / ENTER",confirmedAt:null},
{c:"GHANA",s:"PENDING",name:"TBC / ENTER",contact:"TBC / ENTER",confirmedAt:null},
{c:"SOMALIA",s:"PENDING",name:"TBC / ENTER",contact:"TBC / ENTER",confirmedAt:null},
{c:"TANZANIA",s:"PENDING",name:"TBC / ENTER",contact:"TBC / ENTER",confirmedAt:null},
];

let data=JSON.parse(localStorage.getItem('lamuV6data')||'null')||baseline;

function render(){
const sorted=[...data].sort((a,b)=>{
if(a.s==='CONFIRMED'&&b.s!=='CONFIRMED') return -1;
if(a.s!=='CONFIRMED'&&b.s==='CONFIRMED') return 1;
if(a.s==='CONFIRMED'&&b.s==='CONFIRMED') return (b.confirmedAt||0)-(a.confirmedAt||0);
return 0;
});
const el=document.getElementById('tracker');
el.innerHTML='<table style="width:100%;border-collapse:collapse"><tr style="background:var(--bg);text-align:left"><th style="padding:8px;border:1px solid var(--border)">#</th><th style="padding:8px;border:1px solid var(--border)">COUNTRY / ENTITY</th><th style="padding:8px;border:1px solid var(--border)">STATUS + Time</th><th style="padding:8px;border:1px solid var(--border)">VVIP NAME (Click to Edit)</th><th style="padding:8px;border:1px solid var(--border)">CONTACT (Click to Edit)</th><th class="no-print" style="padding:8px;border:1px solid var(--border)">ACTION</th></tr>'+sorted.map(r=>{
const real=data.indexOf(r);
const time=r.confirmedAt?new Date(r.confirmedAt).toLocaleString():'' ;
return `<tr style="${r.s==='CONFIRMED'?'background:rgba(22,163,74,0.07)':''}"><td style="padding:6px;border:1px solid var(--border)">${sorted.indexOf(r)+1}</td><td style="padding:6px;border:1px solid var(--border);font-weight:bold" contenteditable="true" onblur="upd(${real},'c',this.innerText)">${r.c}</td><td style="padding:6px;border:1px solid var(--border)"><button class="btn ${r.s==='CONFIRMED'?'btn-green':''}" style="${r.s!=='CONFIRMED'?'background:#fef3c7;color:#92400e;border-color:#fde68a':''}" onclick="toggle(${real})">${r.s}</button><div style="font-size:10px!important;color:var(--muted)">${time}</div></td><td style="padding:6px;border:1px solid var(--border)" contenteditable="true" onblur="upd(${real},'name',this.innerText)">${r.name}</td><td style="padding:6px;border:1px solid var(--border)" contenteditable="true" onblur="upd(${real},'contact',this.innerText)">${r.contact}</td><td class="no-print" style="padding:6px;border:1px solid var(--border)"><button class="btn" onclick="rem(${real})">×</button></td></tr>`;
}).join('')+'</table>';
localStorage.setItem('lamuV6data',JSON.stringify(data));
const conf=data.filter(d=>d.s==='CONFIRMED').length;
document.getElementById('subHeader').innerText=`30 Sept 2026, 10:00HRS — Lamu SEZ, Hindi/Witu | Sh2.2T (USD 17B) | CONFIRMED ${conf} / PENDING ${data.length-conf} | Sorted: Latest CONFIRMED on top | Republic of Congo + DRC are SEPARATE countries`;
}
function toggle(i){if(data[i].s==='PENDING'){data[i].s='CONFIRMED';data[i].confirmedAt=Date.now();}else{data[i].s='PENDING';data[i].confirmedAt=null;}render();}
function upd(i,k,v){data[i][k]=v.trim()||'TBC / ENTER';localStorage.setItem('lamuV6data',JSON.stringify(data));}
function addCountry(){const c=prompt('Country / Entity:');if(!c)return;data.push({c:c.toUpperCase(),s:'PENDING',name:'TBC / ENTER',contact:'TBC / ENTER',confirmedAt:null});render();}
function rem(i){if(confirm('Remove this country?')){data.splice(i,1);render();}}
render();

// VIEW-ONLY LOCK
const isEdit=new URLSearchParams(location.search).has('edit');
const info=document.getElementById('modeInfo');
if(isEdit){info.innerText='EDIT MODE ENABLED (?edit) — Full editing allowed. Save after edits.';info.style.color='green';info.style.fontWeight='bold';}
else{
info.innerText='VIEW-ONLY MODE — Add?edit to URL to edit | Print PDF allowed';
document.addEventListener('DOMContentLoaded',()=>{
document.querySelectorAll('[contenteditable=true]').forEach(el=>el.removeAttribute('contenteditable'));
document.querySelectorAll('button').forEach(b=>{
const t=(b.textContent||'').toLowerCase();
if(t.includes('add')||t.includes('save')||t.includes('reset')||t==='×') b.style.display='none';
if(t.includes('confirmed')||t.includes('pending')){b.style.pointerEvents='none';b.style.opacity='0.8';}
});
});
}
</script>
</body>
</html>
